<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | VPN Bot Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}?v=2">
    <style>{{ admin_css|safe }}</style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">Safe-VPN Admin</div>
        <nav class="nav">
          <a class="{{ 'active' if current_path == '/' else '' }}" href="/">Dashboard</a>
          <a class="{{ 'active' if current_path.startswith('/orders') else '' }}" href="/orders">Pending Orders</a>
          <a class="{{ 'active' if current_path.startswith('/wallet') else '' }}" href="/wallet/topups">Wallet Top-ups</a>
          <a class="{{ 'active' if current_path.startswith('/users') else '' }}" href="/users">Users</a>
          <a class="{{ 'active' if current_path.startswith('/services') else '' }}" href="/services">Active Services</a>
          <a class="{{ 'active' if current_path.startswith('/support') else '' }}" href="/support">Support</a>
          <a class="{{ 'active' if current_path.startswith('/resellers') else '' }}" href="/resellers">Resellers</a>
          <a class="{{ 'active' if current_path.startswith('/reseller-orders') else '' }}" href="/reseller-orders">Bulk Orders</a>
          <a class="{{ 'active' if current_path.startswith('/settings') else '' }}" href="/settings">Settings</a>
          <a class="{{ 'active' if current_path.startswith('/broadcast') else '' }}" href="/broadcast">Broadcast</a>
        </nav>
        <form class="logout" method="post" action="/logout">
          <button type="submit">Logout</button>
        </form>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <h1>{{ title }}</h1>
            <span class="muted">Safe-VPN operations console</span>
          </div>
          <span class="badge">Web Admin</span>
        </div>
        {% if msg %}
          <div class="alert {{ level }}">{{ msg }}</div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
