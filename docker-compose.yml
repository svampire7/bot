services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpnbot
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: vpnbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d vpnbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    image: bot-app:latest
    build: .
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: bot-app:latest
    build: .
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.web.main:app --host $${WEB_ADMIN_HOST:-0.0.0.0} --port $${WEB_ADMIN_PORT:-8080}"
    ports:
      - "127.0.0.1:8080:8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vpnbot:vpnbot@postgres:5432/vpnbot
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Tehran}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/app/scripts:ro
      - db_backups:/backups
    command: >
      sh -c "apk add --no-cache python3 py3-aiohttp tzdata gzip &&
             python3 /app/scripts/telegram_db_backup.py"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  db_backups:
